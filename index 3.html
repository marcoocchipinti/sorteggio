<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0f0e">
<title>Sorteggio di Natale · Uruk-Hai</title>
<meta property="og:title" content="Sorteggio di Natale · ASD Hybleasoftair Uruk-Hai">
<meta property="og:description" content="5 € a numero · estrazione 24/12 · scegli e prenota il tuo numero da 1 a 90">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0c0f0e; --ink:#f7f3ec; --muted:#c4bcb0; --gold:#e8c37a; --orange:#ef7f1a;
    --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.14);
    --res:#d6423a; --paid:#1f9d55;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;position:relative}
  .bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .bgfx i{position:absolute;border-radius:50%;filter:blur(70px)}
  .bgfx .a{width:340px;height:340px;left:-130px;top:-120px;background:var(--orange);opacity:.32}
  .bgfx .b{width:300px;height:300px;right:-120px;top:-60px;background:#d6423a;opacity:.26}
  .bgfx .c{width:280px;height:280px;left:30%;top:45%;background:var(--orange);opacity:.12}
  .bgfx .d{width:300px;height:300px;left:-120px;bottom:-80px;background:#1f6b4a;opacity:.3}
  .bgfx .e{width:300px;height:300px;right:-110px;bottom:-120px;background:var(--gold);opacity:.14}
  .wrap{position:relative;z-index:1}
  header{padding:16px 14px 6px;text-align:center}
  .kicker{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
  .titlerow{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 12px}
  .logo{width:52px;height:52px;border-radius:50%;flex:none;box-shadow:0 0 26px 2px rgba(239,127,26,.45)}
  h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.4px;line-height:1.05;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  h1 small{display:block;font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--orange);margin-bottom:3px}
  .pills{display:flex;gap:8px;max-width:560px;margin:0 auto}
  .pill{flex:1;display:flex;flex-direction:column;gap:1px;padding:8px 4px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-b)}
  .pill b{font-size:18px;font-weight:800}
  .pill span{font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .pill.live{border-color:rgba(239,127,26,.55);background:rgba(239,127,26,.12)}
  .pill.live b{color:var(--orange)}
  .rule{margin:9px 0 0;font-size:12px;color:#ddd6cb}
  .rule b{color:var(--ink)}
  main{max-width:560px;margin:0 auto;padding:10px 12px 40px}
  .legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);margin:2px 0 10px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
  .grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
  .n{aspect-ratio:1;border-radius:10px;border:1px solid var(--glass-b);background:var(--glass);
     font-size:17px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .n.reserved{background:var(--res);border-color:var(--res);color:#fff;box-shadow:0 0 12px rgba(214,66,58,.45)}
  .n.paid{background:var(--paid);border-color:var(--paid);color:#fff;box-shadow:0 0 12px rgba(31,157,85,.45)}
  .n:active{transform:scale(.94)}
  .msg{text-align:center;color:var(--muted);font-size:13px;margin:14px 0}
  .list{margin-top:18px;background:var(--glass);border:1px solid var(--glass-b);border-radius:16px;padding:6px 14px}
  .list h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:10px 0 6px}
  .row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px}
  .row:first-of-type{border-top:0}
  .badge{min-width:34px;height:28px;border-radius:8px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
  .row .who{flex:1;overflow-wrap:anywhere}
  .row .who small{display:block;color:var(--muted)}
  .back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .back.open{display:flex}
  .sheet{background:#171a19;color:var(--ink);border:1px solid var(--glass-b);border-bottom:0;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 4px;font-size:20px}
  .sheet .big{font-size:44px;font-weight:800;margin:4px 0 10px;color:var(--orange)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;font-family:inherit;background:rgba(255,255,255,.06);color:var(--ink)}
  input::placeholder,textarea::placeholder{color:#8d877d}
  textarea{min-height:64px;resize:vertical}
  .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  button.b{flex:1;font-size:16px;font-weight:700;padding:13px;border-radius:12px;border:0;cursor:pointer}
  .b.pri{background:var(--orange);color:#1a0f05}
  .b.sec{background:rgba(255,255,255,.1);color:var(--ink)}
  .b.red{background:var(--res);color:#fff}
  .b.green{background:var(--paid);color:#fff}
  .b:disabled{opacity:.5}
  .err{color:#ff7b72;font-size:14px;margin-top:8px;min-height:18px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#111;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;display:none;z-index:20}
  .admin-bar{position:relative;z-index:2;background:var(--gold);color:#1a0f05;text-align:center;font-size:13px;font-weight:600;padding:6px;display:none}
  .admin-bar button{background:rgba(0,0,0,.15);border:0;color:#1a0f05;border-radius:6px;padding:3px 8px;margin-left:8px;font-weight:600}
</style>
</head>

  for(let i=1;i<=90;i++){
    const row=data[i], b=$('n'+i);
    b.className='n'+(row?' '+row.status:'');
    if(row){ row.status==='paid'?p++:r++; }
  }
  $('cFree').textContent=90-r-p; $('cRes').textContent=r; $('cPaid').textContent=p; $('cFreeLbl').textContent=(90-r-p)===1?'libero':'liberi';
  const rows=Object.values(data).sort((a,b)=>a.number-b.number);
  $('list').style.display=rows.length?'block':'none';
  $('rows').innerHTML=rows.map(x=>`
    <div class="row">
      <div class="badge" style="background:${x.status==='paid'?'var(--paid)':'var(--res)'}">${x.number}</div>
      <div class="who">${esc(x.name)}${x.notes?`<small>${esc(x.notes)}</small>`:''}</div>
      <small style="color:var(--muted)">${x.status==='paid'?'Pagato':'Prenotato'}</small>
    </div>`).join('');
  $('adminBar').style.display=adminPin?'block':'none';
}

async function load(){
  const {data:rows,error}=await sb.from('sorteggio_numbers').select('number,name,notes,status').order('number');
  if(error){ $('msg').textContent='Errore di collegamento: '+error.message; return; }
  data={}; rows.forEach(x=>data[x.number]=x);
  $('msg').textContent='Aggiornamento automatico attivo';
  render();
}

function openSheet(html){ $('sheet').innerHTML=html; $('back').classList.add('open'); }
function closeSheet(){ $('back').classList.remove('open'); }
$('back').onclick=e=>{ if(e.target.id==='back') closeSheet(); };

function openNumber(n){
  const row=data[n];
  if(!row){
    openSheet(`
      <h3>Prenota il numero</h3>
      <div class="big">${n}</div>
      <label>Il tuo nome *</label>
      <input id="fName" maxlength="80" autocomplete="name" placeholder="Nome e cognome">
      <label>Note (facoltative)</label>
      <textarea id="fNotes" maxlength="300" placeholder="Es. pago sabato"></textarea>
      <div class="err" id="fErr"></div>
      <div class="btns">
        <button class="b sec" onclick="closeSheet()">Annulla</button>
        <button class="b pri" id="fGo">Prenota</button>
      </div>`);
    try{ $('fName').value=localStorage.getItem('sorteggio_name')||''; }catch(e){}
    $('fGo').onclick=()=>reserve(n);
    return;
  }
  const st=row.status==='paid'?'<span style="color:var(--paid);font-weight:700">Pagato</span>':'<span style="color:var(--res);font-weight:700">Prenotato</span>';
  let adminBtns='';
  if(adminPin){
    adminBtns=`<div class="btns">
      ${row.status!=='paid'?`<button class="b green" onclick="adminSet(${n},'paid')">Segna pagato</button>`:`<button class="b red" onclick="adminSet(${n},'reserved')">Torna prenotato</button>`}
      <button class="b sec" onclick="adminSet(${n},'free')">Libera numero</button>
    </div><div class="err" id="aErr"></div>`;
  }
  openSheet(`
    <h3>Numero ${n}</h3>
    <div class="big">${n}</div>
    <div style="font-size:17px"><b>${esc(row.name)}</b> · ${st}</div>
    ${row.notes?`<div style="color:var(--muted);margin-top:6px">${esc(row.notes)}</div>`:''}
    ${adminBtns}
    <div class="btns"><button class="b sec" onclick="closeSheet()">Chiudi</button></div>`);
}

async function reserve(n){
  const name=$('fName').value.trim(), notes=$('fNotes').value.trim();
  if(!name){ $('fErr').textContent='Inserisci il tuo nome'; return; }
  $('fGo').disabled=true; $('fErr').textContent='';
  const {error}=await sb.rpc('reserve_sorteggio_number',{p_number:n,p_name:name,p_notes:notes});
  if(error){
    $('fErr').textContent=/already|già|duplicate/i.test(error.message)?'Peccato, qualcuno l\'ha appena preso! Scegline un altro.':error.message;
    $('fGo').disabled=false; load(); return;
  }
  try{ localStorage.setItem('sorteggio_name',name); }catch(e){}
  closeSheet(); toast('Numero '+n+' prenotato! 🎉'); load();
}

async function adminSet(n,status){
  const {error}=await sb.rpc('admin_set_sorteggio_status',{p_number:n,p_status:status,p_pin:adminPin});
  if(error){
    $('aErr').textContent=error.message;
    if(/PIN/i.test(error.message)){ adminPin=null; try{sessionStorage.removeItem('sorteggio_pin');}catch(e){} render(); }
    return;
  }
  closeSheet(); toast(status==='paid'?'Segnato come pagato':status==='free'?'Numero liberato':'Tornato prenotato'); load();
}

/* Modalità organizzatore: tieni premuto il titolo per 2 secondi */
let pressT;
$('title').addEventListener('pointerdown',()=>{ pressT=setTimeout(askPin,2000); });
['pointerup','pointerleave','pointercancel'].forEach(ev=>$('title').addEventListener(ev,()=>clearTimeout(pressT)));
function askPin(){
  openSheet(`
    <h3>Area organizzatore</h3>
    <label>PIN</label>
    <input id="pin" type="password" inputmode="numeric">
    <div class="btns">
      <button class="b sec" onclick="closeSheet()">Annulla</button>
      <button class="b pri" id="pinGo">Entra</button>
    </div>`);
  $('pinGo').onclick=()=>{
    adminPin=$('pin').value.trim(); if(!adminPin) return;
    try{ sessionStorage.setItem('sorteggio_pin',adminPin); }catch(e){}
    closeSheet(); render(); toast('Tocca un numero per gestirlo');
  };
}
$('adminOff').onclick=()=>{ adminPin=null; try{sessionStorage.removeItem('sorteggio_pin');}catch(e){} render(); };

buildGrid();
load();
sb.channel('sorteggio').on('postgres_changes',{event:'*',schema:'public',table:'sorteggio_numbers'},()=>load()).subscribe();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
